
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

issueTrackerURL="https://github.com/QuotaGamer/TransFE/issues"


[[mods]] #mandatory
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="Quota (GitHub @QuotaGamer)"
description='''
TransFE bridges Forge Energy sources with Create: Power Grid and Create: The Factory Must Grow's electrical networks, allowing you to use one for them all.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "[6.0.9,6.1.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "powergrid"
type = "required"
versionRange = "[0.5.4,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersiveengineering"
type = "optional"
versionRange = "[1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tfmg"
type = "required"
versionRange = "[1.2.0,)"
ordering = "NONE"
side = "BOTH"